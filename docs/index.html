<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0F5C4A">
<title>Analyse PEA</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#F6F7F4;--card:#fff;--ink:#14201B;--ink2:#5B665F;--line:#E3E6E0;--pri:#0F5C4A;--pri2:#E3F0EA;--pos:#0F6B57;--neg:#B4410C;--warn:#B07A00;--band:rgba(15,92,74,.10);--grid:#E9ECE6}
@media (prefers-color-scheme:dark){:root{--bg:#121714;--card:#1B221E;--ink:#EEF1EC;--ink2:#A3AEA7;--line:#2B342F;--pri:#5CC4A4;--pri2:#1F3029;--pos:#5CC4A4;--neg:#F08A5D;--warn:#E3B341;--band:rgba(92,196,164,.13);--grid:#262E29}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:76px}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
h1{font-size:22px;margin:0;letter-spacing:-.02em}
h2{font-size:16px;margin:0 0 10px}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.banner{background:#FCEFC7;color:#6B4A00;font-size:13px;font-weight:600;padding:8px 16px;text-align:center}
.top{display:none}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:5;height:64px}
nav.tabs a{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0 2px;text-align:center;font-size:11px;font-weight:500;color:var(--ink2);min-height:44px;white-space:nowrap}
nav.tabs a svg{width:22px;height:22px;flex:none}
nav.tabs a.on{color:var(--pri);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.muted{color:var(--ink2);font-size:13px}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2)}
.filters input,.filters select{height:44px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--bg)}
.filters .full{grid-column:1/-1}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.row .c{display:none}
.sc{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.hi{background:#D6EBE3;color:#0A4034}.mid{background:#FCEFC7;color:#6B4A00}.lo{background:#F6DCCD;color:#8A2F05}.na{background:var(--line);color:var(--ink2)}
.nm b{display:block;font-size:15px}.nm span{font-size:12px;color:var(--ink2)}
.px{text-align:right}.px b{display:block}.px span{font-size:12px;font-weight:600}
.head{display:none}
.pills{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
.pills button{height:44px;min-width:56px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.pills button.on{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:600}
canvas{display:block;width:100%}
.chart{position:relative}
.tip{font-size:13px;color:var(--ink2);min-height:20px;margin-top:6px}
.badge{display:inline-block;padding:6px 10px;border-radius:8px;font-weight:700;font-size:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.k{background:var(--bg);border-radius:10px;padding:10px}.k .l{font-size:12px;color:var(--ink2)}.k .v{font-size:18px;font-weight:700}.k .n{font-size:11px;color:var(--ink2)}
.bar{height:8px;border-radius:4px;background:var(--grid);margin:6px 0 10px}.bar i{display:block;height:8px;border-radius:4px}
.lab{display:flex;justify-content:space-between;font-size:13px}
.kv{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;border-top:1px solid var(--line)}.kv:first-of-type{border-top:0}.kv span{color:var(--ink2)}
.star{height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600}
.star.on{background:var(--pri2);border-color:var(--pri);color:var(--pri)}
.back{display:inline-flex;align-items:center;height:44px;color:var(--pri);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:18px;background:var(--pri2);color:var(--pri);font-weight:600;font-size:13px;border:0;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{white-space:nowrap;padding:8px 8px;text-align:right;border-top:1px solid var(--line)}th:first-child,td:first-child{text-align:left}
.scroll{overflow-x:auto}
.ln{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;margin-bottom:8px}.ln .x{background:none;border:0;color:var(--ink2);font-size:13px;cursor:pointer;min-height:44px;padding:0 6px}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);font:12px/1.4 ui-monospace,monospace}
.ac{position:absolute;left:0;right:0;top:100%;margin:4px 0 0;padding:4px;list-style:none;background:var(--card);border:1px solid var(--line);border-radius:10px;max-height:min(260px,40vh);overflow-y:auto;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.ac li{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--ink)}
.ac li:hover{background:var(--pri2)}.ac li span{color:var(--ink2);font-size:12px;white-space:nowrap}.ac li.none{color:var(--ink2);cursor:default}
.btn{height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--pri);background:var(--pri);color:#fff;font-weight:600;cursor:pointer}.btn.alt{background:var(--card);color:var(--pri)}
.err{color:var(--neg);font-size:13px;min-height:18px;margin-top:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:4px}
@media (min-width:800px){
  body{padding-bottom:0}
  nav.tabs{position:static;height:auto;border:0;background:none;display:flex;gap:4px}
  nav.tabs a{flex:none;flex-direction:row;padding:10px 14px;border-radius:8px;font-size:14px}
  nav.tabs a svg{display:none}
  nav.tabs a.on{background:var(--pri2)}
  .top{display:flex;align-items:center;gap:20px;background:var(--card);border-bottom:1px solid var(--line);padding:12px 32px}
  .top .brand{font-weight:700;font-size:19px;color:var(--pri);letter-spacing:-.02em}
  .filters{grid-template-columns:repeat(6,minmax(0,1fr))}.filters .full{grid-column:span 2}
  .row{grid-template-columns:48px minmax(160px,1.6fr) repeat(5,minmax(60px,.7fr)) 110px;padding:10px 14px}
  .row .c{display:block;text-align:right;font-size:14px}
  .head{display:grid;grid-template-columns:48px minmax(160px,1.6fr) repeat(5,minmax(60px,.7fr)) 110px;gap:12px;padding:0 14px;font-size:12px;color:var(--ink2);margin-top:12px}
  .head div{text-align:right}.head div:nth-child(-n+2){text-align:left}
  .two{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:14px;align-items:start}
  .grid2.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
}
</style>

<body>
<div id="banner"></div>
<div class="top"><div class="brand">Analyse PEA</div><nav class="tabs" id="nav-d"></nav></div>
<div id="alerts"></div>
<div class="wrap" id="app"><p class="muted">Chargement…</p></div>
<nav class="tabs" id="nav-m" style="display:flex"></nav>
<script>
"use strict";
const $=s=>document.querySelector(s);
const nf=(v,d=1)=>v==null||!isFinite(v)?'–':v.toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d});
const pc=(v,d=1)=>v==null||!isFinite(v)?'–':nf(v*100,d)+' %';
const sg=(v,d=1)=>v==null||!isFinite(v)?'–':(v>0?'+':v<0?'−':'')+nf(Math.abs(v)*100,d)+' %';
const sgs=z=>{const r=Math.round(Math.abs(z)*10)/10;return (r===0?'':z>0?'+':'−')+nf(r,1)+'σ'};
const money=(v,c)=>nf(v,2)+' '+(c==='EUR'||!c?'€':c==='USD'?'$':c==='GBP'?'£':c);
const bn=v=>v==null?'–':nf(v/1e9,1)+' Md';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const SECT={'Commodities':'Matières premières','Technology':'Technologie','Healthcare':'Santé','Financial Services':'Finance','Industrials':'Industrie','Consumer Cyclical':'Conso. cyclique','Consumer Defensive':'Conso. de base','Energy':'Énergie','Basic Materials':'Matériaux','Utilities':'Services publics','Communication Services':'Communication','Real Estate':'Immobilier'};
const sect=s=>SECT[s]||s||'Autre';
const CN={FR:'France',NL:'Pays-Bas',DE:'Allemagne',IT:'Italie',ES:'Espagne',BE:'Belgique',FI:'Finlande',IE:'Irlande',PT:'Portugal',LU:'Luxembourg',DK:'Danemark',SE:'Suède'};
const ctry=c=>CN[c]||c||'';
const RF=0.02, WEEK=604800000;
let TR=true, STOCKS=[], COMS=[], ETFS=[], LIST=[], DATA=null, BYT={}, STATE={q:'',sector:'',country:'',minScore:0,maxPer:'',minDy:'',minRoe:'',sort:'score'}, CMP=[], CMPY=5, PERIOD=10;

/* ---------- statistiques ---------- */
const ser=s=>TR&&s.hist.a?s.hist.a:s.hist.c;
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
const sd=(a,ddof=1)=>{const m=mean(a);return Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/(a.length-ddof))};
const cache={};
function stats(s,years){
  const key=s.t+'|'+years+'|'+(TR&&s.hist.a?1:0); if(cache[key]) return cache[key];
  const all=ser(s), n=Math.min(all.length, Math.round(years*52));
  if(n<20) return cache[key]=null;
  const c=all.slice(-n), y=c.map(Math.log), xs=y.map((_,i)=>i);
  const mx=mean(xs), my=mean(y);
  let sxy=0,sxx=0; for(let i=0;i<n;i++){sxy+=(xs[i]-mx)*(y[i]-my);sxx+=(xs[i]-mx)**2}
  const b=sxy/sxx, a=my-b*mx;
  const res=y.map((v,i)=>v-(a+b*i));
  const sse=res.reduce((t,r)=>t+r*r,0), sst=y.reduce((t,v)=>t+(v-my)**2,0);
  const sigma=Math.sqrt(sse/(n-2));
  const r=[]; for(let i=1;i<n;i++) r.push(Math.log(c[i]/c[i-1]));
  const vol=sd(r)*Math.sqrt(52);
  const cagr=Math.pow(c[n-1]/c[0],52/(n-1))-1;
  let peak=c[0],dd=0; for(const v of c){peak=Math.max(peak,v);dd=Math.min(dd,v/peak-1)}
  let beta=null; const B=DATA.meta.bench;
  if(B&&B.start&&B.c.length){
    const i0=Math.round(Date.parse(s.hist.start)/WEEK)+all.length-n, j0=Math.round(Date.parse(B.start)/WEEK);
    const rs=[],rb=[];
    for(let i=1;i<n;i++){const jb=i0+i-j0; if(jb>=1&&jb<B.c.length){rs.push(r[i-1]);rb.push(Math.log(B.c[jb]/B.c[jb-1]))}}
    if(rs.length>30){const ms=mean(rs),mb=mean(rb);let cv=0,vb=0;for(let i=0;i<rs.length;i++){cv+=(rs[i]-ms)*(rb[i]-mb);vb+=(rb[i]-mb)**2}beta=cv/vb}
  }
  return cache[key]={n,a,b,sigma,r2:1-sse/sst,z:res[n-1]/sigma,trend:Math.exp(52*b)-1,vol,cagr,sharpe:(cagr-RF)/vol,maxdd:dd,beta,perf:c[n-1]/c[0]-1,c};
}
const dateAt=(s,i)=>new Date(Date.parse(s.hist.start)+i*WEEK);

/* ---------- scores (percentiles dans le secteur) ---------- */
function pctRank(v,arr,hi){
  const a=arr.filter(x=>x!=null&&isFinite(x));
  if(v==null||!isFinite(v)||a.length<2) return null;
  let below=0,eq=0; for(const x of a){if(x<v)below++;else if(x===v)eq++}
  const p=(below+0.5*(eq-1))/(a.length-1)*100;
  return hi?p:100-p;
}
const avg=a=>{const f=a.filter(x=>x!=null);return f.length?mean(f):null};
const cg=(a)=>a&&a.length>=2&&a[0]>0&&a[a.length-1]>0?Math.pow(a[a.length-1]/a[0],1/(a.length-1))-1:null;
function scoreAll(){
  for(const s of DATA.stocks) if((s.kind||'stock')!=='stock') s.score={q:null,v:null,d:null,g:null,total:null};
  const S=STOCKS;
  for(const s of S){s.revg=cg(s.rev);s.nig=cg(s.ni);s.payS=s.payout==null?null:s.payout<=0?null:s.payout<=0.6?100:Math.max(0,100-(s.payout-0.6)/0.4*100)}
  const bySector={}; for(const s of S)(bySector[s.sector]=bySector[s.sector]||[]).push(s);
  for(const s of S){
    const g=(bySector[s.sector].length>=6)?bySector[s.sector]:S;
    const P=(k,hi,f=x=>x[k])=>pctRank(f(s),g.map(f),hi);
    const q=avg([P('roe',true),P('margin',true),P('opm',true),P('de',false),P('ndebitda',false)]);
    const perOk=x=>x.per!=null&&x.per>0?x.per:null;
    const v=avg([s.per!=null&&s.per<=0?0:pctRank(perOk(s),g.map(perOk),false),P('pb',false),P('fcfy',true),P('evebitda',false)]);
    const pays=s.dy>0;
    const d=pays?avg([P('dy',true),s.payS,P('dgrowth',true),Math.min(s.dyears,15)/15*100]):null;
    const gr=avg([P('revg',true),P('nig',true),P('epsg',true)]);
    const ax={q,v,d,g:gr}, W={q:.30,v:.25,d:.25,g:.20};
    let t=0,w=0; for(const k in ax) if(ax[k]!=null){t+=ax[k]*W[k];w+=W[k]}
    s.score={...ax,total:w?t/w:null};
  }
}
const cls=v=>v==null?'na':v>=70?'hi':v>=50?'mid':'lo';
const r0=v=>v==null?'–':String(Math.round(v));

/* ---------- navigation ---------- */
const IC={screener:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',portfolio:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>',compare:'<path d="M4 19V5M4 19h16M8 15l4-5 3 3 5-7"/>',watch:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',method:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/>'};
const TABS=[['#screener','Screener','screener'],['#portfolio','Portefeuille','portfolio'],['#compare','Comparateur','compare'],['#watch','Suivi','watch'],['#method','Méthode','method']];
const slug=t=>t.replace(/\./g,'-');
function nav(){
  const h=location.hash||'#screener', cur=h.startsWith('#s-')||h==='#'?'#screener':h;
  const html=TABS.map(([u,l,i])=>`<a href="${u}" class="${cur===u?'on':''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[i]}</svg><span>${l}</span></a>`).join('');
  $('#nav-m').innerHTML=html;$('#nav-d').innerHTML=html;
  $('#nav-m').style.display=innerWidth>=800?'none':'flex';
}
const watch=()=>{try{return JSON.parse(localStorage.getItem('pea.watch')||'[]')}catch(e){return[]}};
const setWatch=a=>{try{localStorage.setItem('pea.watch',JSON.stringify(a))}catch(e){}renderAlerts()};

/* ---------- saisie avec suggestions ---------- */
const norm=t=>t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function autocomplete(inp,pick,opt){
  const clear=opt&&opt.clear, host=inp.parentElement; host.style.position='relative';
  const ul=document.createElement('ul'); ul.className='ac'; ul.hidden=true; ul.setAttribute('role','listbox'); host.appendChild(ul);
  let items=[];
  const match=q=>{
    q=norm(q.trim()); const S=opt&&opt.all?DATA.stocks:LIST;
    if(!q) return S.slice().sort((a,b)=>a.name.localeCompare(b.name,'fr')).slice(0,60);
    const sc=x=>{const n=norm(x.name),t=norm(x.t);return n.startsWith(q)?0:n.split(/[\s'’-]+/).some(w=>w.startsWith(q))?1:n.includes(q)?2:t.startsWith(q)?3:t.includes(q)?4:9};
    return S.map(x=>[sc(x),x]).filter(x=>x[0]<9).sort((a,b)=>a[0]-b[0]||a[1].name.localeCompare(b[1].name,'fr')).map(x=>x[1]).slice(0,60);
  };
  const place=()=>{
    const vv=window.visualViewport,top0=vv?vv.offsetTop:0,bot=vv?vv.offsetTop+vv.height:innerHeight;
    const r=inp.getBoundingClientRect(),below=bot-r.bottom-8,above=r.top-top0-8,up=below<200&&above>below;
    ul.style.maxHeight=Math.max(120,Math.min(260,up?above:below))+'px';
    if(up){ul.style.top='auto';ul.style.bottom=(host.offsetHeight-inp.offsetTop+4)+'px';ul.style.margin='0'}else{ul.style.top='100%';ul.style.bottom='auto';ul.style.margin='4px 0 0'}
  };
  if(window.visualViewport) visualViewport.addEventListener('resize',()=>{if(!ul.hidden&&host.isConnected)place()});
  const render=()=>{items=match(inp.value);ul.innerHTML=items.length?items.map((x,i)=>`<li role="option" data-i="${i}"><b>${esc(x.name)}</b><span>${esc(x.t)} · ${esc(ctry(x.country))}</span></li>`).join(''):'<li class="none">Aucune valeur trouvée</li>';ul.hidden=false;place();ul.scrollTop=0};
  const close=()=>{ul.hidden=true};
  const choose=x=>{inp.value=clear?'':x.name;close();pick(x)};
  inp.setAttribute('autocomplete','off');
  inp.addEventListener('input',render); inp.addEventListener('focus',render);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(items[0]&&!ul.hidden)choose(items[0])}else if(e.key==='Escape')close()});
  ul.addEventListener('click',e=>{e.preventDefault();const li=e.target.closest('li[data-i]');if(li)choose(items[+li.dataset.i])});
  document.addEventListener('pointerdown',e=>{if(!host.contains(e.target))close()});
}

/* ---------- vue : screener ---------- */
function rowHtml(s){
  const st1=stats(s,1), st5=stats(s,5), day=s.prev?s.price/s.prev-1:null;
  const z=st5?st5.z:null;
  return `<a class="row" href="#s-${slug(s.t)}">
    <div class="sc ${cls(s.score.total)}">${r0(s.score.total)}</div>
    <div class="nm"><b>${esc(s.name)}</b><span>${esc(s.country||'')} · ${esc(sect(s.sector))} · PER ${nf(s.per,0)} · Div. ${pc(s.dy)}</span></div>
    <div class="c">${nf(s.per,1)}</div><div class="c">${pc(s.dy)}</div><div class="c">${pc(s.roe)}</div>
    <div class="c ${st1&&st1.perf>=0?'pos':'neg'}">${st1?sg(st1.perf):'–'}</div>
    <div class="c">${z==null?'–':sgs(z)}</div>
    <div class="px"><b>${money(s.price,s.currency)}</b><span class="${day!=null&&day>=0?'pos':'neg'}">${sg(day)}</span></div></a>`;
}
function filtered(){
  const f=STATE,q=f.q.trim().toLowerCase();
  let L=LIST.filter(s=>
    (!q||s.name.toLowerCase().includes(q)||s.t.toLowerCase().includes(q))&&
    (!f.sector||s.sector===f.sector)&&(!f.country||s.country===f.country)&&
    (s.score.total==null?f.minScore<=0:s.score.total>=f.minScore)&&
    (f.maxPer===''||(s.per!=null&&s.per>0&&s.per<=+f.maxPer))&&
    (f.minDy===''||(s.dy!=null&&s.dy*100>=+f.minDy))&&
    (f.minRoe===''||(s.roe!=null&&s.roe*100>=+f.minRoe)));
  const key={score:s=>s.score.total,dy:s=>s.dy,per:s=>s.per>0?-s.per:null,roe:s=>s.roe,z:s=>{const t=stats(s,5);return t?-t.z:null},name:s=>s.name};
  const k=key[f.sort]||key.score;
  L.sort((a,b)=>{const x=k(a),y=k(b);if(f.sort==='name')return a.name.localeCompare(b.name,'fr');return (y==null?-1e9:y)-(x==null?-1e9:x)});
  return L;
}
function viewScreener(){
  const sectors=[...new Set(LIST.map(s=>s.sector))].sort();
  const countries=[...new Set(LIST.map(s=>s.country))].sort((a,b)=>ctry(a).localeCompare(ctry(b),'fr'));
  $('#app').innerHTML=`<h1>Screener PEA</h1>

/* ---------- graphiques ---------- */
function setup(c,h){const d=window.devicePixelRatio||1,w=c.parentElement.clientWidth;c.style.width=w+'px';c.style.height=h+'px';c.width=w*d;c.height=h*d;const g=c.getContext('2d');g.setTransform(d,0,0,d,0,0);return{g,w,h}}
function priceChart(canvas,s,years,tipEl){
  const st=stats(s,years); if(!st){tipEl.textContent='Historique insuffisant.';return}
  const {n,a,b,sigma,c}=st, H=innerWidth<700?240:320;
  const L=[...c.map(Math.log)];
  const reg=i=>a+b*i;
  const ymin=Math.min(...L,reg(0)-2*sigma,reg(n-1)-2*sigma)-.02, ymax=Math.max(...L,reg(0)+2*sigma,reg(n-1)+2*sigma)+.02;
  const pL=46,pR=8,pT=8,pB=22;
  function draw(hov){
    const {g,w,h}=setup(canvas,H), X=i=>pL+i/(n-1)*(w-pL-pR), Y=v=>pT+(1-(v-ymin)/(ymax-ymin))*(h-pT-pB);
    g.clearRect(0,0,w,h); g.font='11px system-ui'; g.fillStyle=css('--ink2'); g.strokeStyle=css('--grid'); g.lineWidth=1;
    for(let k=0;k<=4;k++){const v=ymin+(ymax-ymin)*k/4,y=Y(v);g.beginPath();g.moveTo(pL,y);g.lineTo(w-pR,y);g.stroke();g.textAlign='right';g.fillText(nf(Math.exp(v),Math.exp(v)<20?1:0),pL-6,y+4)}
    g.textAlign='center'; const ticks=5;
    for(let k=0;k<ticks;k++){const i=Math.round(k*(n-1)/(ticks-1)),d=dateAt(s,s.hist.c.length-n+i);g.textAlign=k===0?'left':k===ticks-1?'right':'center';g.fillText(years<=2?d.toLocaleDateString('fr-FR',{month:'short',year:'2-digit'}):String(d.getFullYear()),X(i),h-6)}
    g.fillStyle=css('--band');g.beginPath();g.moveTo(X(0),Y(reg(0)+sigma));g.lineTo(X(n-1),Y(reg(n-1)+sigma));g.lineTo(X(n-1),Y(reg(n-1)-sigma));g.lineTo(X(0),Y(reg(0)-sigma));g.closePath();g.fill();
    g.setLineDash([4,4]);g.lineWidth=1;g.strokeStyle=css('--ink2');
    for(const k of[2,-2]){g.beginPath();g.moveTo(X(0),Y(reg(0)+k*sigma));g.lineTo(X(n-1),Y(reg(n-1)+k*sigma));g.stroke()}
    g.strokeStyle=css('--warn');g.lineWidth=1.8;g.beginPath();g.moveTo(X(0),Y(reg(0)));g.lineTo(X(n-1),Y(reg(n-1)));g.stroke();g.setLineDash([]);
    g.strokeStyle=css('--pri');g.lineWidth=2;g.lineJoin='round';g.beginPath();L.forEach((v,i)=>i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v)));g.stroke();
    if(hov!=null){const x=X(hov);g.strokeStyle=css('--ink2');g.lineWidth=1;g.beginPath();g.moveTo(x,pT);g.lineTo(x,h-pB);g.stroke();g.fillStyle=css('--pri');g.beginPath();g.arc(x,Y(L[hov]),4,0,7);g.fill()}
  }
  const info=i=>{const d=dateAt(s,s.hist.c.length-n+i),z=(L[i]-reg(i))/sigma;tipEl.textContent=`${d.toLocaleDateString('fr-FR')} · ${TR&&s.hist.a?'valeur ajustée':'cours'} ${money(c[i],s.currency)} · écart à la tendance ${sgs(z)}`};
  draw(null); info(n-1);
  const mv=e=>{const r=canvas.getBoundingClientRect(),i=Math.max(0,Math.min(n-1,Math.round((e.clientX-r.left-pL)/(r.width-pL-pR)*(n-1))));draw(i);info(i)};
  canvas.onpointermove=mv; canvas.onpointerdown=mv; canvas.onpointerleave=()=>{draw(null);info(n-1)};
  canvas.style.touchAction='pan-y';
}
function barsChart(canvas,s){
  const Y=s.years||[],R=s.rev||[],N=s.ni||[]; if(!Y.length){canvas.parentElement.innerHTML='<p class="muted">Pas de données de résultats.</p>';return}
  const {g,w,h}=setup(canvas,180), max=Math.max(...R,...N,1), pB=22,pT=14, gw=w/Y.length;
  g.font='11px system-ui';
  Y.forEach((yr,i)=>{
    const bw=Math.min(34,gw/3), x0=i*gw+gw/2-bw;
    for(const [k,v,col] of [[0,R[i],css('--pri')],[1,N[i],css('--neg')]]){
      const bh=Math.max(0,(v||0)/max)*(h-pB-pT); g.fillStyle=col; g.fillRect(x0+k*bw,h-pB-bh,bw-2,bh);
      g.fillStyle=css('--ink2');g.textAlign='center';g.fillText(nf((v||0)/1e9,1),x0+k*bw+bw/2-1,h-pB-bh-3);
    }
    g.fillStyle=css('--ink2');g.textAlign='center';g.fillText(yr,i*gw+gw/2,h-6);
  });
}
function zText(z){
  const a=Math.abs(z),dir=z>0?'au-dessus':'en dessous';
  if(a<.5) return 'Proche de sa tendance de long terme.';
  if(a<1.5) return `Un peu ${dir} de sa tendance de long terme.`;
  return `Nettement ${dir} de sa tendance de long terme.`;
}

const LCOL=['#0F5C4A','#B4410C','#3B6FD4','#8A4FB8'];
function viewCompare(){
  $('#app').innerHTML=`<h1>Comparateur</h1><p class="muted">Jusqu'à 4 valeurs, base 100 au début de la période.</p>

   <div class="chart"><canvas id="cc"></canvas></div><div class="legend" id="clg"></div></div>
  <div class="card scroll" id="ctab"></div>`;

    $('#chips').innerHTML=CMP.map((t,i)=>`<button class="chip" data-t="${esc(t)}" style="background:${LCOL[i]};color:#fff">${esc(BYT[t].name)} ✕</button>`).join('')||'<span class="muted">Aucune valeur sélectionnée.</span>';
    $('#clg').innerHTML='';
    const S=CMP.map(t=>BYT[t]), cv=$('#cc');
    if(!S.length){setup(cv,10);$('#ctab').innerHTML='';return}
    const n=Math.min(Math.round(CMPY*52),...S.map(s=>ser(s).length));
    const lines=S.map(s=>{const c=ser(s).slice(-n);return c.map(v=>v/c[0]*100)});
    const {g,w,h}=setup(cv,innerWidth<700?240:320), pL=40,pR=8,pT=8,pB=22;
    const lo=Math.min(...lines.flat()),hi=Math.max(...lines.flat()),X=i=>pL+i/(n-1)*(w-pL-pR),Y=v=>pT+(1-(v-lo)/(hi-lo))*(h-pT-pB);
    g.font='11px system-ui';g.strokeStyle=css('--grid');g.fillStyle=css('--ink2');
    for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4,y=Y(v);g.beginPath();g.moveTo(pL,y);g.lineTo(w-pR,y);g.stroke();g.textAlign='right';g.fillText(nf(v,0),pL-6,y+4)}
    const d0=dateAt(S[0],S[0].hist.c.length-n),d1=dateAt(S[0],S[0].hist.c.length-1);g.textAlign='left';g.fillText(d0.toLocaleDateString('fr-FR',{month:'short',year:'numeric'}),pL,h-6);g.textAlign='right';g.fillText(d1.toLocaleDateString('fr-FR',{month:'short',year:'numeric'}),w-pR,h-6);
    lines.forEach((a,k)=>{g.strokeStyle=LCOL[k];g.lineWidth=2;g.beginPath();a.forEach((v,i)=>i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v)));g.stroke()});
    $('#clg').innerHTML=S.map((s,k)=>`<span><i style="background:${LCOL[k]}"></i>${esc(s.name)}</span>`).join('');
    $('#ctab').innerHTML=`<table><tr><th>Valeur</th><th>Perf.</th><th>Rend./an</th><th>σ vol.</th><th>Baisse max</th><th>Sharpe</th><th>Bêta</th><th>Score</th></tr>${S.map(s=>{const st=stats(s,CMPY);return st?`<tr><td>${esc(s.name)}</td><td>${sg(st.perf,0)}</td><td>${sg(st.cagr)}</td><td>${pc(st.vol)}</td><td>${sg(st.maxdd,0)}</td><td>${nf(st.sharpe,2)}</td><td>${st.beta==null?'–':nf(st.beta,2)}</td><td>${r0(s.score.total)}</td></tr>`:''}).join('')}</table>`;
  };
  autocomplete($('#cadd'),x=>{if(!CMP.includes(x.t)&&CMP.length<4)CMP.push(x.t);paint()},{clear:true,all:true});
  $('#chips').onclick=e=>{const t=e.target.closest('[data-t]')?.dataset.t;if(t){CMP=CMP.filter(x=>x!==t);paint()}};
  $('#cper').onclick=e=>{const y=e.target.dataset.y;if(!y)return;CMPY=+y;[...$('#cper').children].forEach(b=>b.classList.toggle('on',+b.dataset.y===CMPY));paint()};
  paint();
}


/* ---------- alertes (vérifiées à l'ouverture) ---------- */
const alGet=()=>{try{const o=JSON.parse(localStorage.getItem('pea.alerts')||'{}');return o&&typeof o==='object'?o:{}}catch(e){return{}}};
const alSet=o=>{try{localStorage.setItem('pea.alerts',JSON.stringify(o))}catch(e){}renderAlerts()};
const alCfg=()=>{const o=alGet();return{sig:o.sig??2,move:o.move??5,prices:o.prices||{}}};
let ALDISMISS=false;
const alScope=()=>[...new Set([...watch(),...pfGet().map(p=>p.t)])].filter(t=>BYT[t]);
function computeAlerts(){
  const c=alCfg(),out=[];
  for(const t of alScope()){
    const s=BYT[t],st=stats(s,5),day=s.prev?s.price/s.prev-1:null,pr=c.prices[t]||{};
    if(st&&c.sig>0&&Math.abs(st.z)>=c.sig) out.push({t,text:`${sgs(st.z)} : ${st.z<0?'nettement sous':'nettement au-dessus de'} sa tendance`});
    if(day!=null&&c.move>0&&Math.abs(day)*100>=c.move) out.push({t,text:`${sg(day)} au dernier cours`});
    if(pr.above!=null&&s.price>=pr.above) out.push({t,text:`cours ${money(s.price,s.currency)}, au-dessus de ${nf(pr.above,2)}`});
    if(pr.below!=null&&s.price<=pr.below) out.push({t,text:`cours ${money(s.price,s.currency)}, sous ${nf(pr.below,2)}`});
  }
  return out;
}
function renderAlerts(){
  const el=$('#alerts'); if(!el||!DATA) return;
  const L=(ALDISMISS||(location.hash||'').startsWith('#s-'))?[]:computeAlerts();
  el.innerHTML=L.length?`<div class="wrap" style="padding-bottom:0"><div class="card" style="border-color:var(--warn);margin-bottom:0">
   <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2 style="margin:0">Alertes (${L.length})</h2><button class="star" id="al-x" style="height:36px">Masquer</button></div>
   ${L.map(a=>`<a href="#s-${slug(a.t)}" style="display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px"><b>${esc(BYT[a.t].name)}</b><span style="color:var(--ink2);text-align:right">${esc(a.text)}</span></a>`).join('')}</div></div>`:'';
  const b=$('#al-x'); if(b) b.onclick=()=>{ALDISMISS=true;renderAlerts()};
}
function alertSettings(){
  const c=alCfg(),pr=Object.entries(c.prices).filter(([t,v])=>BYT[t]&&(v.above!=null||v.below!=null));
  return `<div class="card"><h2>Alertes</h2>
   <p class="muted" style="margin:0 0 10px">Vérifiées à chaque ouverture de l'app, pour tes valeurs suivies et ton portefeuille, d'après les dernières données (mises à jour chaque soir de semaine). Aucune notification n'est envoyée si l'app est fermée. Mets 0 pour désactiver une règle.</p>
   <div class="filters"><label>Écart à la tendance (σ)<input id="al-sig" type="number" inputmode="decimal" step="0.5" min="0" value="${c.sig}"></label>
   <label>Variation du jour (%)<input id="al-move" type="number" inputmode="decimal" step="1" min="0" value="${c.move}"></label></div>
   <h2 style="margin-top:16px">Alertes de cours</h2>
   ${pr.map(([t,v])=>`<div class="kv"><span><b style="color:var(--ink)">${esc(BYT[t].name)}</b> · ${v.above!=null?'≥ '+nf(v.above,2):''}${v.above!=null&&v.below!=null?' · ':''}${v.below!=null?'≤ '+nf(v.below,2):''}</span><button class="x" data-alx="${esc(t)}" style="background:none;border:0;color:var(--ink2);min-height:44px;cursor:pointer">Retirer</button></div>`).join('')||'<p class="muted" style="margin:0">Aucune. Crée-les depuis la fiche d\'une valeur.</p>'}</div>`;
}
function bindAlertSettings(){
  const sv=()=>{const o=alGet();const f=x=>{const v=parseFloat(x);return v>=0?v:null};
    const a=f($('#al-sig').value),m=f($('#al-move').value);if(a!=null)o.sig=a;if(m!=null)o.move=m;alSet(o)};
  $('#al-sig').addEventListener('change',sv);$('#al-move').addEventListener('change',sv);
  document.querySelectorAll('[data-alx]').forEach(b=>b.onclick=()=>{const o=alGet();if(o.prices)delete o.prices[b.dataset.alx];alSet(o);viewWatch()});
}

/* ---------- vue : suivi ---------- */
function viewWatch(){
  const L=watch().map(t=>BYT[t]).filter(Boolean);
  $('#app').innerHTML=`<h1>Suivi</h1><p class="muted">Valeurs suivies (enregistrées sur cet appareil uniquement).</p>
  <div class="head"><div></div><div>Valeur</div><div>PER</div><div>Div.</div><div>ROE</div><div>1 an</div><div>Écart σ (5 ans)</div><div>Cours</div></div>
  <div class="list">${L.map(rowHtml).join('')||'<div class="card muted">Aucune valeur suivie. Ouvre une fiche et touche « Suivre ».</div>'}</div>
  <div style="margin-top:14px">${alertSettings()}</div>`;
  bindAlertSettings();
}


/* ---------- vue : portefeuille ---------- */
const pfGet=()=>{try{const a=JSON.parse(localStorage.getItem('pea.pf')||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}};
const pfSet=a=>{try{localStorage.setItem('pea.pf',JSON.stringify(a))}catch(e){}renderAlerts()};
let PFADD=null;
const alloc=(m,tot,f)=>Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="lab"><span>${esc(f(k))}</span><b>${nf(v/tot*100,1)} %</b></div><div class="bar"><i style="width:${v/tot*100}%;background:var(--pri)"></i></div>`).join('');
function viewPortfolio(){
  const P=pfGet().filter(p=>BYT[p.t]&&p.q>0).map(p=>{const s=BYT[p.t],eur=!s.currency||s.currency==='EUR',value=p.q*s.price,cost=p.q*p.pru;return{...p,s,eur,value,cost,pl:value-cost}});
  const inc=P.filter(p=>p.eur), V=inc.reduce((t,p)=>t+p.value,0), C=inc.reduce((t,p)=>t+p.cost,0), PL=V-C;
  const div=inc.reduce((t,p)=>t+p.value*(p.s.dy||0),0);
  const bySec={},byCty={}; for(const p of inc){bySec[p.s.sector]=(bySec[p.s.sector]||0)+p.value;byCty[p.s.country]=(byCty[p.s.country]||0)+p.value}
  const W=inc.map(p=>p.value/V), hhi=W.reduce((t,w)=>t+w*w,0);
  const top=[...inc].sort((a,b)=>b.value-a.value)[0];
  let risk=null;
  if(inc.length){
    const L=inc.map(p=>ser(p.s)), n=Math.min(260,...L.map(a=>a.length));
    if(n>=30){
      const val=[];for(let i=0;i<n;i++)val.push(inc.reduce((t,p,k)=>t+p.q*L[k][L[k].length-n+i],0));
      const r=[];for(let i=1;i<n;i++)r.push(Math.log(val[i]/val[i-1]));
      let pk=val[0],dd=0;for(const v of val){pk=Math.max(pk,v);dd=Math.min(dd,v/pk-1)}
      let beta=null;const B=DATA.meta.bench;
      if(B&&B.c.length>n){const bl=B.c.length,rb=[];for(let i=1;i<n;i++){const jb=bl-1-(n-1-i);rb.push(Math.log(B.c[jb]/B.c[jb-1]))}
        const ms=mean(r),mb=mean(rb);let cv=0,vb=0;for(let i=0;i<r.length;i++){cv+=(r[i]-ms)*(rb[i]-mb);vb+=(rb[i]-mb)**2}beta=cv/vb}
      risk={n,val,vol:sd(r)*Math.sqrt(52),cagr:Math.pow(val[n-1]/val[0],52/(n-1))-1,dd,beta};
    }
  }
  const eur=v=>nf(v,0)+' €', pre=PFADD?BYT[PFADD]:null; PFADD=null;
  $('#app').innerHTML=`<h1>Portefeuille</h1>
  <p class="muted">Tes lignes sont enregistrées sur cet appareil uniquement. Pour les retrouver sur un autre appareil, utilise l'export en bas de page.</p>
  <div class="card"><h2>Valeur du portefeuille</h2>
   <div style="font-size:30px;font-weight:700">${inc.length?eur(V):'–'}</div>
   <div class="${PL>=0?'pos':'neg'}" style="font-weight:600">${inc.length?(PL>=0?'▲ +':'▼ −')+eur(Math.abs(PL))+' ('+sg(C?PL/C:null)+')':''}</div>
   <div class="grid2" style="margin-top:12px">
    <div class="k"><div class="l">Montant investi</div><div class="v">${eur(C)}</div></div>
    <div class="k"><div class="l">Lignes</div><div class="v">${P.length}</div></div>
    <div class="k"><div class="l">Dividendes estimés /an</div><div class="v">${eur(div)}</div><div class="n">${V?pc(div/V)+' de rendement':''}</div></div>
    <div class="k"><div class="l">Lignes effectives</div><div class="v">${inc.length?nf(1/hhi,1):'–'}</div><div class="n">${top?'1ère : '+esc(top.s.name)+' '+nf(top.value/V*100,0)+' %':''}</div></div></div>
   <div class="lab" style="margin-top:12px"><span>Montant investi / plafond PEA</span><b>${nf(C/150000*100,0)} %</b></div>
   <div class="bar"><i style="width:${Math.min(100,C/150000*100)}%;background:var(--pri)"></i></div>
   <p class="muted" style="margin:0">Indicatif : le plafond de 150 000 € porte sur les versements, pas sur la valeur ni sur le prix de revient.</p></div>
  <div class="card"><h2>Ajouter ou modifier une ligne</h2>
   <div class="filters"><label class="full">Valeur<input id="pf-n" placeholder="Tape un nom, ex. air, total, lvmh" value="${pre?esc(pre.name):''}"></label>
    <label>Quantité<input id="pf-q" type="number" inputmode="decimal" min="0" placeholder="10"></label>
    <label>Prix de revient (€/action)<input id="pf-p" type="number" inputmode="decimal" min="0" step="0.01" placeholder="150,00"></label></div>
   <div style="margin-top:10px"><button class="btn" id="pf-add">Enregistrer la ligne</button></div><div class="err" id="pf-err"></div>
   <p class="muted" style="margin:0">Une valeur déjà présente est remplacée. Pour la retirer, touche « Retirer ».</p></div>
  <div id="pf-list">${P.map(p=>`<div class="ln"><div><b>${esc(p.s.name)}</b><div class="muted">${nf(p.q,p.q%1?2:0)} × ${money(p.s.price,p.s.currency)}${p.eur?'':' · devise non convertie, exclue des totaux'}</div></div>
    <div style="text-align:right"><b>${p.eur?eur(p.value):'–'}</b><div class="${p.pl>=0?'pos':'neg'}" style="font-size:13px;font-weight:600">${p.eur?(p.pl>=0?'+':'−')+eur(Math.abs(p.pl))+' ('+sg(p.cost?p.pl/p.cost:null)+')':''}</div></div>
    <div class="muted">${p.eur?nf(p.value/V*100,1)+' % du portefeuille':''}</div><div style="text-align:right"><a class="x" href="#s-${slug(p.t)}">Fiche</a><button class="x" data-del="${esc(p.t)}">Retirer</button></div></div>`).join('')||'<div class="card muted">Aucune ligne pour l\'instant. Ajoute ta première valeur ci-dessus.</div>'}</div>
  ${inc.length?`<div class="two" style="margin-top:6px"><div class="card"><h2>Répartition par secteur</h2>${alloc(bySec,V,k=>sect(k))}</div><div class="card"><h2>Répartition par pays</h2>${alloc(byCty,V,k=>ctry(k))}</div></div>`:''}
  ${risk?`<div class="card"><h2>Risque et historique <span class="muted">(${nf(risk.n/52,1)} ans, avec les quantités actuelles)</span></h2>
   <div class="chart"><canvas id="pfc"></canvas></div>
   <div class="kv"><span>Volatilité annuelle (σ)</span><b>${pc(risk.vol)}</b></div><div class="kv"><span>Baisse maximale</span><b>${sg(risk.dd)}</b></div>
   <div class="kv"><span>Rendement annuel moyen</span><b>${sg(risk.cagr)}</b></div><div class="kv"><span>Bêta vs ${esc(DATA.meta.bench?.name||'indice')}</span><b>${risk.beta==null?'–':nf(risk.beta,2)}</b></div>
   <p class="muted" style="margin:8px 0 0">Simulation : ce qu'aurait donné la détention des quantités actuelles. Ce n'est pas ta performance réelle.</p></div>`:''}
  <div class="card"><h2>Sauvegarde</h2><textarea id="pf-json" aria-label="Contenu de la sauvegarde" placeholder="Colle ici une sauvegarde puis touche Importer"></textarea>
   <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><button class="btn alt" id="pf-exp">Exporter</button><button class="btn alt" id="pf-imp">Importer</button></div><div class="err" id="pf-msg"></div></div>`;
  autocomplete($('#pf-n'),()=>$('#pf-q').focus());
  const find=v=>{v=v.trim().toLowerCase();return LIST.find(x=>x.name.toLowerCase()===v||x.t.toLowerCase()===v)};
  $('#pf-add').onclick=()=>{
    const s=find($('#pf-n').value),q=parseFloat($('#pf-q').value),pr=parseFloat($('#pf-p').value),er=$('#pf-err');
    if(!s){er.textContent='Choisis une valeur dans la liste.';return}
    if(!(q>0)){er.textContent='Indique une quantité supérieure à 0.';return}
    if(!(pr>=0)){er.textContent='Indique le prix de revient par action.';return}
    const a=pfGet().filter(p=>p.t!==s.t);a.push({t:s.t,q,pru:pr});pfSet(a);viewPortfolio();
  };
  $('#pf-list').onclick=e=>{const t=e.target.dataset?.del;if(t){pfSet(pfGet().filter(p=>p.t!==t));viewPortfolio()}};
  $('#pf-exp').onclick=()=>{const j=JSON.stringify(pfGet());$('#pf-json').value=j;$('#pf-msg').style.color='var(--ink2)';let ok=false;try{navigator.clipboard.writeText(j).then(()=>{$('#pf-msg').textContent='Sauvegarde copiée.'},()=>{})}catch(e){}$('#pf-msg').textContent='Sauvegarde affichée : copie le texte.'};
  $('#pf-imp').onclick=()=>{
    const m=$('#pf-msg');m.style.color='var(--neg)';
    try{const a=JSON.parse($('#pf-json').value);
      if(!Array.isArray(a)||!a.every(p=>p&&BYT[p.t]&&p.q>0&&p.pru>=0))throw 0;
      pfSet(a.map(p=>({t:p.t,q:+p.q,pru:+p.pru})));viewPortfolio();
    }catch(e){m.textContent='Sauvegarde illisible, ou contenant une valeur inconnue.'}
  };
  if(risk){
    const {g,w,h}=setup($('#pfc'),200),v=risk.val,lo=Math.min(...v),hi=Math.max(...v),pL=52,pR=8,pT=8,pB=8,X=i=>pL+i/(v.length-1)*(w-pL-pR),Y=x=>pT+(1-(x-lo)/(hi-lo||1))*(h-pT-pB);
    g.font='11px system-ui';g.fillStyle=css('--ink2');g.strokeStyle=css('--grid');
    for(let k=0;k<=3;k++){const x=lo+(hi-lo)*k/3,y=Y(x);g.beginPath();g.moveTo(pL,y);g.lineTo(w-pR,y);g.stroke();g.textAlign='right';g.fillText(nf(x/1000,0)+' k€',pL-6,y+4)}
    g.strokeStyle=css('--pri');g.lineWidth=2;g.beginPath();v.forEach((x,i)=>i?g.lineTo(X(i),Y(x)):g.moveTo(X(i),Y(x)));g.stroke();
  }
}

/* ---------- vue : méthode ---------- */
function viewMethod(){
  $('#app').innerHTML=`<h1>Méthode</h1>
  <div class="card"><h2>Score global (0 à 100)</h2><p>Chaque indicateur est classé par rapport aux valeurs du même secteur (percentile). Le score est la moyenne pondérée de 4 axes :</p>
  <div class="kv"><span>Qualité (30 %)</span><b>ROE, marges nette et opérationnelle, faible endettement (dette/fonds propres et dette nette/EBITDA)</b></div>
  <div class="kv"><span>Valorisation (25 %)</span><b>PER bas, Price/Book bas, VE/EBITDA bas, rendement FCF élevé</b></div>
  <div class="kv"><span>Dividende (25 %)</span><b>rendement, distribution soutenable, croissance, années de hausse</b></div>
  <div class="kv"><span>Croissance (20 %)</span><b>chiffre d'affaires, résultat net et bénéfice par action</b></div>
  <p class="muted">Une valeur sans dividende n'a pas d'axe Dividende : les autres axes sont repondérés. Un secteur de moins de 6 valeurs est comparé à l'ensemble.</p></div>
  <div class="card"><h2>Canal de régression et σ</h2><p>On ajuste une droite sur le logarithme du cours (tendance exponentielle). σ est l'écart-type des écarts entre le cours et cette droite. L'écart actuel exprimé en σ indique si la valeur est au-dessus (+) ou en dessous (−) de sa tendance. C'est une description du passé : une valeur peut rester longtemps hors de son canal, ou sa tendance peut changer.</p></div>
  <div class="card"><h2>Rendement total</h2><p>Par défaut, les cours sont ajustés des dividendes (rendement total, dividendes réinvestis) : la tendance, la volatilité, le Sharpe et les comparaisons en tiennent compte. Le bouton « Cours seul » de la fiche revient au cours brut. Si une valeur n'a pas de série ajustée, le cours brut est utilisé.</p></div>
  <div class="card"><h2>Risque</h2><p>Volatilité (σ des rendements hebdomadaires annualisé), baisse maximale, ratio de Sharpe (taux sans risque fixé à 2 %), bêta par rapport à l'indice.</p></div>
  <div class="card"><h2>Données</h2><p>Source : ${esc(DATA.meta.source)}. Cours hebdomadaires sur 10 ans. Fondamentaux gratuits souvent incomplets : un « – » signifie donnée absente. Mise à jour : ${new Date(DATA.meta.updated).toLocaleString('fr-FR')}.</p>
  <p class="muted">Outil d'analyse personnel, pas un conseil en investissement. Vérifie l'éligibilité PEA d'une valeur auprès de ton courtier avant d'acheter.</p></div>`;
}

/* ---------- routeur ---------- */
function route(keep){
  nav(); const h=location.hash||'#screener';
  if(!DATA) return;
  if(h.startsWith('#s-')){const k=h.slice(3),s=DATA.stocks.find(x=>slug(x.t)===k);viewStock(s?s.t:k)}
  else if(h==='#portfolio') viewPortfolio();
  else if(h==='#compare') viewCompare();
  else if(h==='#watch') viewWatch();
  else if(h==='#method') viewMethod();
  else viewScreener();
  renderAlerts();
  if(!keep) window.scrollTo(0,0);
}
addEventListener('hashchange',()=>route());
let rz,lastW=innerWidth;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(innerWidth!==lastW){lastW=innerWidth;const y=scrollY;route(true);scrollTo(0,y)}},200)});
fetch('data/stocks.json').then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(d=>{
  DATA=d; for(const s of DATA.stocks)BYT[s.t]=s; STOCKS=DATA.stocks.filter(s=>(s.kind||'stock')==='stock'); ETFS=DATA.stocks.filter(s=>s.kind==='etf'); LIST=[...STOCKS,...ETFS]; COMS=DATA.stocks.filter(s=>s.kind==='commodity'); scoreAll();
  if(d.meta.demo) $('#banner').innerHTML='<div class="banner">Données fictives de démonstration</div>';
  route();
}).catch(e=>{$('#app').innerHTML='<div class="card"><h2>Données introuvables</h2><p class="muted">Impossible de charger data/stocks.json ('+esc(e.message)+'). Si tu as ouvert le fichier directement, lance un petit serveur local : <code>python -m http.server</code> dans le dossier docs, ou utilise GitHub Pages.</p></div>'});
