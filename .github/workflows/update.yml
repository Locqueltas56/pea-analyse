name: Mise à jour des données

on:
  schedule:
    - cron: "30 17 * * 1-5"   # chaque jour de semaine, après la clôture
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - run: python tools/fetch_data.py
      - name: Enregistrer les données
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || (git commit -m "Mise à jour des données" && git push)
